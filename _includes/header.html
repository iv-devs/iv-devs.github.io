<nav class="navbar navbar-expand-md">
  <div class="container p-b-5 p-t-5">
    <a class="navbar-brand" href="/">
      <img class="logo" src="/assets/img/logo_h.png" alt="IV Devs">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-main" aria-controls="navbar-main" aria-expanded="false" aria-label="Abrir navegación">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbar-main">
      <ul class="navbar-nav">
        {% assign pages = site.pages | sort:"order" %}
        {% for my_page in pages %}
          {% if my_page.title %}
            {% if page.url == my_page.url %}
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{{ my_page.url | prepend: site.baseurl }}">
                  &lt; {{ my_page.title }} /&gt;
                </a>
              </li>
            {% elsif my_page.menu != false %}
              <li class="nav-item">
                <a class="nav-link" href="{{ my_page.url | prepend: site.baseurl }}">
                  &lt; {{ my_page.title }} /&gt;
                </a>
              </li>
            {% endif %}
          {% endif %}
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
